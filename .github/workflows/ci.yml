name: CI

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
    schedule:
        - cron: '0 6 * * 1' # Every Monday at 06:00 UTC

jobs:
    version-check:
        name: Version Sync Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  extensions: fileinfo

            - name: Cache Composer dependencies
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-8.4-vendor-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.4-vendor-

            - name: Install dependencies
              run: composer install --no-progress

            # Phase 16: script-level drift detection (constant vs readme.txt
            # Stable tag vs plugin header vs all CSS/JS @version strings).
            - name: Verify version synchronization
              run: php scripts/verify-version-sync.php

            # Phase 16: PHPUnit-level regression on the SSCRIBE_VERSION ↔
            # readme.txt ↔ package.json contract (locks the canonical
            # source-of-truth at the unit-test boundary).
            - name: Version sync integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Version_Sync_Test.php

            # Phase 24: Upgrade Notice CI — enforces the WP.org contract
            # for the readme.txt == Upgrade Notice == section (presence,
            # body length, no HTML/Markdown, single paragraph, every entry
            # has a matching Changelog, Stable tag has a matching entry).
            - name: Verify Upgrade Notice contract
              run: php scripts/verify-upgrade-notice.php

            # Phase 24: PHPUnit-level regression for the Upgrade Notice
            # verifier — runs the script against well-formed and mutated
            # readme.txt payloads.
            - name: Upgrade Notice integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Upgrade_Notice_Test.php

            # Phase 25: WP/PHP minimum CI — locks mainfile header ↔
            # readme.txt ↔ runtime version_compare() guard. Drift here
            # ships an installable-on-PHP-8.1 build that fatals on
            # first admin page load.
            - name: Verify WP/PHP minimum contract
              run: php scripts/verify-min-versions.php

            # Phase 25: PHPUnit-level regression for the WP/PHP minimum
            # verifier — runs the script against well-formed and mutated
            # mainfile + readme.txt pairs.
            - name: WP/PHP minimum integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Minimum_Versions_Test.php

            # Phase 26: Tested-up-to CI — locks the readme.txt
            # `Tested up to:` header inside the canonical WP range
            # (declared WP minimum .. freshness ceiling). A stale or
            # typo'd header is rejected by Plugin Check at submission.
            - name: Verify Tested up to contract
              run: php scripts/verify-tested-up-to.php

            # Phase 26: PHPUnit-level regression for the Tested-up-to
            # verifier — runs the script against well-formed and mutated
            # readme.txt payloads.
            - name: Tested up to integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Tested_Up_To_Test.php

            # Phase 27: Real WordPress testbench contract — pins the
            # presence of bin/install-wp-tests.sh, phpunit-wp.xml,
            # tests-wp/wp-tests-config.php, tests-wp/bootstrap.php, the
            # SQLite drop-in plugin, and SScribe_WP_TestCase extending
            # WP_UnitTestCase. Also runs a clean phpunit-wp pass against
            # the live bench (skipped if bench not installed locally).
            - name: Real WP testbench contract
              run: vendor/bin/phpunit tests/Integration/SScribe_Real_WP_Testbench_Test.php

            # Phase 28: Strauss vendor-prefix contract — enforces that
            # composer.json declares the extra.strauss block (target,
            # namespace_prefix, classmap_prefix, packages), that the
            # vendor:prefix script is wired with the three fixup
            # passes, and that vendor-prefixed/ does not leak any
            # un-prefixed library class. Without this, SScribe ships
            # with classes that collide with every other plugin on a
            # shared WordPress install.
            - name: Verify Strauss vendor-prefix contract
              run: php scripts/verify-strauss-config.php

            # Phase 28: PHPUnit-level regression for the Strauss
            # verifier — runs against well-formed and mutated composer.json
            # payloads.
            - name: Strauss vendor-prefix integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Strauss_Config_Test.php

            # Phase 29: E2E dev-dependency contract — pins package.json
            # devDependencies (@playwright/test, @axe-core/playwright,
            # @wp-playground/cli), the test:e2e:* npm scripts, the
            # playwright.config.ts project list (e2e, a11y, perf), the
            # presence of tests-e2e/{e2e,a11y}/ subdirs, and the
            # composer release:prepare + release scripts.
            - name: Verify E2E dev-dependency contract
              run: php scripts/verify-e2e-deps.php

            # Phase 29: PHPUnit-level regression for the E2E deps
            # verifier — runs against well-formed and mutated payloads.
            - name: E2E dev-dependency integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_E2E_Deps_Test.php

            # Phase 31: continue-on-error contract — pins the per-page
            # try/catch + `continue` on no-page-data / insufficient-memory
            # branches, the sscribe_after_export_page observability
            # seam, the failed_pages column in the activator schema,
            # the failed_pages persistence in export_stats, and the
            # failed_pages tally in the finalizer. Without this guard,
            # a single bad page aborts the whole export.
            - name: Verify continue-on-error contract
              run: php scripts/verify-continue-on-error.php

            # Phase 31: PHPUnit-level regression for the continue-on-error
            # verifier — runs against well-formed and mutated production
            # payloads.
            - name: Continue-on-error integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Continue_On_Error_Test.php

            # Phase 32: security scanner — enforces the no-eval / no-shell /
            # no-extract / no-$$_GET / no-bare-wp_ajax baseline across
            # every shipped .php file under includes/, admin/, public/.
            # A single line of eval( $_POST['code'] ) ships to every
            # install the moment it is merged.
            - name: Security scanner
              run: php scripts/verify-security-scan.php

            # Phase 32: PHPUnit-level regression for the security
            # scanner — runs against well-formed and mutated payloads.
            - name: Security scanner integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Security_Scan_Test.php

            # Phase 33: WordPress Plugin Check CI contract — pins the
            # plugin-check job (uses wordpress/plugin-check-action@v1,
            # strict: true, include-experimental: true, depends on
            # [test, frontend-quality, audit, real-wp-tests], audits
            # ./dist/sscribe-export-site-pages). Without this guard,
            # a regression in the Plugin Check wiring silently ships
            # a build that WP.org rejects on submission.
            - name: Verify Plugin Check CI contract
              run: php scripts/verify-plugin-check.php

            # Phase 33: PHPUnit-level regression for the Plugin Check
            # verifier — runs against well-formed and mutated ci.yml
            # payloads.
            - name: Plugin Check CI integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Plugin_Check_Test.php

            # Phase 34: ZIP certification — enforces the official WP.org
            # submission ZIP contract (well-formed ZipArchive, exactly one
            # `sscribe-export-site-pages/` top-level entry, required
            # mainfile/readme/license/uninstall/autoload entries, no
            # dev-only paths, no forbidden extensions, < 10 MB
            # compressed, matching SHA-256 sidecar). Without this guard,
            # a regression in scripts/build-release.php silently ships
            # a ZIP that WP.org rejects on submission. The
            # `--skip-validation` flag bypasses the pre-flight test /
            # PHPStan / PHPCS pass (already enforced by the `test` and
            # `lint` jobs) so the build only produces the dist tree
            # this verifier certifies.
            - name: Build the submission ZIP
              run: php scripts/build-release.php --skip-validation

            - name: Verify ZIP certification contract
              run: php scripts/verify-zip-certification.php

            # Phase 34: PHPUnit-level regression for the ZIP
            # certification verifier — runs against well-formed and
            # mutated synthetic ZIPs.
            - name: ZIP certification integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_ZIP_Certification_Test.php

            # Phase 35: ZIP content rules — walks the dist tree the ZIP
            # was packaged from and enforces every shipped PHP file
            # parses, the composer.json autoload still points at
            # `vendor-prefixed/` (not `vendor/`), readme.txt fits the
            # WP.org 10 KiB cap, languages/ ships a translation file,
            # no entry is empty, no OS-metadata files (.DS_Store /
            # Thumbs.db / desktop.ini) leak in, the dist mainfile
            # Version header matches the ZIP filename version, no
            # dev-only top-level directory (`.git/`, `tests/`,
            # `node_modules/`, `.idea/`, plain `vendor/`, …) ships,
            # no IDE/temp/env/log marker (`.env`, `*.swp`, `*.log`)
            # leaks in, and the runtime directories WP.org requires
            # (`vendor-prefixed/`, `assets/`, `license.txt`,
            # `uninstall.php`) are present.
            - name: Verify ZIP content rules
              run: php scripts/verify-zip-content-rules.php

            # Phase 35: PHPUnit-level regression for the ZIP content
            # rules verifier — runs against well-formed and mutated
            # synthetic dist trees.
            - name: ZIP content rules integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_ZIP_Content_Rules_Test.php

            # Phase 36: source / build transparency — WP.org reviewers
            # must be able to reproduce the shipped ZIP. readme.txt
            # must carry a `== Development ==` section that names the
            # public source repo, lists every build command, and pins
            # the required tool versions; composer.json must declare
            # the PHP version floor; composer.lock must be committed;
            # package.json must pin the Node version in `engines`;
            # scripts/build-release.php must exist; and
            # docs/BUILD_TRANSFORMATIONS.md must document every build
            # transformation. A regression that drops the source URL,
            # unpins a tool version, or deletes the build doc fails
            # the gate before submission.
            - name: Verify build transparency contract
              run: php scripts/verify-build-transparency.php

            # Phase 36: PHPUnit-level regression for the build
            # transparency verifier — runs against the live repo with
            # one-off mutations (stripped Development section, blanked
            # Author URI, missing composer.lock, missing build doc).
            - name: Build transparency integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Build_Transparency_Test.php

            # Phase 37: third-party license inventory — walks the shipped
            # dist tree (the same tree the submission ZIP was packaged
            # from) and asserts every bundled dependency ships its own
            # LICENSE / COPYING / NOTICE with a GPL-2.0-or-later
            # compatible SPDX identifier. WP.org reviewers specifically
            # check mPDF (GPL-2.0-only), PHPWord (LGPL-3.0-only),
            # PSR/container (MIT), and bundled fonts (OFL-1.1). A
            # missing or incompatible license is an automatic reject.
            - name: Verify third-party license inventory
              run: php scripts/verify-third-party-license.php

            # Phase 37: PHPUnit-level regression for the third-party
            # license verifier — runs against the live dist tree with
            # one-off mutations (missing mpdf LICENSE.txt, proprietary
            # license body, missing font OFL.txt).
            - name: Third-party license inventory integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Third_Party_License_Test.php

            # Phase 38: mkdir() containment — audits every wp_mkdir_p()
            # and SScribe_Filesystem->mkdir() callsite under includes/,
            # admin/, public/. Each callsite must be either inside
            # SScribe_Private_Storage, routed through the public
            # SScribe_Filesystem surface (which carries its own
            # containment check), or explicitly annotated as a
            # transient working-file tempdir. Without this guard,
            # a future caller can slip a wp_mkdir_p('/tmp/foo') past
            # the audit and ship a release that escapes SScribe's
            # private-storage boundary.
            - name: Verify mkdir() containment contract
              run: php scripts/verify-mkdir-containment.php

            # Phase 38: PHPUnit-level regression for the mkdir()
            # containment verifier — runs against the live source
            # tree with a one-off mutation (an uncategorised
            # wp_mkdir_p() callsite planted under admin/).
            - name: mkdir() containment integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Mkdir_Containment_Test.php

            # Phase 39: sticky-bit regression — pins every scenario
            # the security invariant requires (current-owned 0700,
            # foreign-owned 0755/0777 reject, foreign-owned 01777
            # accept, symlink reject, public-root reject). Without
            # these explicit regressions a future "simplification" of
            # is_owned_by_current_process() could silently re-weaken
            # the shared-host defense and ship a release that exposes
            # private exports on shared hosts. The POSIX branches
            # are exercised on the Linux CI runners.
            - name: Sticky-bit regression integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Sticky_Bit_Regression_Test.php

            # Phase 40: PHPStan ignore-rule audit — every ignoreErrors
            # entry in phpstan.neon must be classified as either
            # `unavoidable_third_party` (WP/mPDF/DOM stub missing) or
            # `technical_debt` (known runtime-guard false positive).
            # Broad directory globs (`admin/*`, `vendor/*`) and
            # unclassified patterns are release blockers — the spec
            # explicitly forbids baseline-style "ignore everything in
            # admin/*" suppressions.
            - name: Verify PHPStan ignore-rule audit
              run: php scripts/verify-phpstan-ignores.php

            # Phase 40: PHPUnit-level regression for the ignore-rule
            # audit — confirms the manifest persists, the
            # classification table covers every rule, and PHPStan
            # itself still passes at Level 7.
            - name: PHPStan ignore-rule audit integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_PHPStan_Ignores_Test.php

            # Phase 41: coverage-threshold gate — the verifier parses
            # the Clover XML written by phpunit.xml's <coverage>
            # block and enforces two contracts: project-wide ≥ 70%
            # and every security-critical module ≥ 90% (private
            # storage, filesystem, security, audit trail). This
            # integration test exercises the verifier with planted
            # fixtures (well-formed, low project coverage, low
            # critical-module coverage, missing critical file,
            # missing clover.xml) so the gate contract is locked
            # without depending on a coverage driver on the local
            # machine.
            - name: Coverage threshold gate integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Coverage_Thresholds_Test.php

            # Phase 42: i18n contract — every translation call
            # declares the canonical text domain, the POT declares
            # X-Domain + Project-Id-Version that match the plugin,
            # and every source msgid is in the POT. Without this
            # gate, a future "fix typo in placeholder" patch could
            # ship a missing msgid that translators never see.
            - name: Verify i18n contract
              run: php scripts/verify-i18n.php

            - name: i18n contract integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_I18N_Test.php

            # Phase 43: accessibility static contract — every shipped
            # admin partial passes the eight static a11y checks
            # (accessible names on inputs/buttons, decorative SVGs,
            # aria-controls targets exist, no positive tabindex, no
            # inline handlers, sequential heading levels, visible
            # :focus styles). The full WCAG 2.2 AA / best-practice
            # matrix runs at runtime in the e2e axe specs. Without
            # this gate, a regression in the markup ships a build
            # whose admin UI fails screen-reader accessibility.
            - name: Verify accessibility contract
              run: composer test:a11y

            - name: Accessibility contract integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Accessibility_Test.php

            # Phase 44: performance budget — the CI smoke test renders
            # 100 mock HTML pages and asserts the run stays inside the
            # budget codified in scripts/verify-performance-budget.php
            # (5s wall, 100ms per page, 256 MiB peak). The verifier
            # also cross-checks the live-reference budgets in the
            # manifest against docs/PERFORMANCE_BENCHMARKS_v2.0.0.md so
            # the reviewer-visible doc and the CI gate cannot drift.
            # Without this guard a regression in the rendering hot path
            # silently ships a release that breaks the
            # ~6-7-minute 1000-page export budget.
            - name: Performance budget gate
              run: composer test:perf

            - name: Performance budget integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Performance_Budget_Test.php

            # Phase 45: session / resume regression — pins the
            # export-pipeline checkpoint contract (create/get/update/
            # delete, page_ids are the resume checkpoint, validate()
            # gate, active-session transient, concurrent-export
            # block). Without these regressions a future "simplification"
            # of SScribe_Session could silently ship a build that
            # loses export state on the first network blip.
            - name: Session/resume regression test
              run: vendor/bin/phpunit tests/Integration/SScribe_Session_Resume_Test.php

            # Phase 46: export format matrix — the admin UI's
            # format picker must resolve every value to a real
            # exporter class that implements SScribe_Exporter_Interface.
            # Without this guard a regression that drops an
            # exporter (or breaks the interface contract) silently
            # ships a release whose UI offers a format that has
            # no working implementation.
            - name: Format matrix gate
              run: composer test:format-matrix

            - name: Format matrix integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Format_Matrix_Test.php

            # Phase 47: export result validation — the file a
            # customer downloads must agree with the format picker
            # (extension + MIME) and the wrapper/factory API surface
            # must stay stable. Without this guard a regression that
            # renames or removes an exporter method silently ships
            # a build that produces a malformed download.
            - name: Export result validation gate
              run: composer test:export-result

            - name: Export result validation integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Export_Result_Validation_Test.php

            # Phase 48: download security — the customer's download
            # link is gated by a single-use 32-hex token persisted on
            # the export row. The token must be validated with
            # hash_equals (constant-time), rotated atomically, and
            # fail closed on empty / wrong / missing tokens. Without
            # this gate a regression that drops the lock or skips
            # rotation ships a release whose download URL either
            # leaks across users or works forever.
            - name: Download security gate
              run: composer test:download-security

            - name: Download security integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Download_Security_Test.php

            # Phase 49: AJAX security inventory — every
            # wp_ajax_sscribe_* action registered must either flow
            # through SScribe_Loader::add_guarded_ajax_action()
            # (which wraps the callback with nonce + capability
            # checks) or be wrapped in a centralized
            # verify_request_authorization() that runs
            # check_ajax_referer + current_user_can. Zero
            # wp_ajax_nopriv_sscribe_* registrations allowed.
            - name: AJAX security inventory gate
              run: composer test:ajax-security

            - name: AJAX security integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Ajax_Security_Test.php

            # Phase 50: lifecycle contract — activation,
            # deactivation, and uninstall must stay in their lanes.
            # Without this gate a regression that lets the
            # deactivator delete user options ships a release that
            # destroys data when the user only deactivates; a
            # regression that skips the WP_UNINSTALL_PLUGIN guard
            # ships a release whose uninstall runs outside the
            # WP-managed lifecycle.
            - name: Lifecycle gate
              run: composer test:lifecycle

            - name: Lifecycle integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Lifecycle_Test.php

            # Phase 52: workflow governance — every release-required
            # workflow must be a hard gate. No `continue-on-error: true`
            # on required steps; no `if: failure()` outside artifact
            # upload steps. Without this guard a regression that masks
            # a required check with `continue-on-error: true` silently
            # ships a release whose gate is bypassed.
            - name: Workflow governance gate
              run: composer test:workflow-governance

            - name: Workflow governance integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Workflow_Governance_Test.php

            # Phase 53: release workflow architecture — the release
            # pipeline MUST split certification (build + plugin-check +
            # artifact upload) from publication (download certified
            # artifact + SHA verify + gh release upload). The publish
            # job MUST NOT run composer install, vendor:prefix, or
            # build-release.php — that would be a second uncontrolled
            # build after approval.
            - name: Release pipeline architecture gate
              run: composer test:release-pipeline

            - name: Release pipeline integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Release_Pipeline_Test.php

            # Phase 54: tag policy — release tags must point at
            # origin/main HEAD, must equal SSCRIBE_VERSION, must NOT
            # be cut by CI itself, must be signed via `gh release
            # create --verify-tag`, and the certified build evidence
            # must record source_sha + tag + zip_sha256 so an
            # independent auditor can verify.
            - name: Tag policy gate
              run: composer test:tag-policy

            - name: Tag policy integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Tag_Policy_Test.php

            # Phase 55: branch protection — docs/BRANCH_PROTECTION_v2.0.0.md
            # is the auditable contract for which GitHub branch-protection
            # rules apply. The verifier asserts the doc declares every
            # required clause (no force-push, no admin bypass, required
            # reviews, conversation resolution, --signoff, squash-only,
            # audited-SHA pin) and that it cross-references the companion
            # release evidence files. The integration test pins the same
            # contract at the PHPUnit boundary.
            - name: Branch protection contract gate
              run: composer test:branch-protection

            - name: Branch protection integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Branch_Protection_Test.php

            # Phase 56: real-WP matrix — single-leg (PHP 8.4 / latest
            # WP / SQLite) is a smoke test; a real matrix exercises
            # 8.2/8.3/8.4 × WP latest/previous with per-leg log
            # artifacts and fail-fast: false. The verifier walks the
            # matrix block in ci.yml and asserts every contract
            # clause; the integration test pins the same contract at
            # the PHPUnit boundary.
            - name: Real-WP matrix contract gate
              run: composer test:real-wp-matrix

            - name: Real-WP matrix integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Real_WP_Matrix_Test.php

            # Phase 57: WPML test strategy — WPML is a paid
            # third-party plugin; we cannot fetch it in CI. The
            # strategy is: (a) ship a strategy doc, (b) pin the
            # canonical detection pair (ICL_SITEPRESS_VERSION +
            # SitePress), (c) pin the canonical filter
            # (wpml_current_language), (d) exercise both the
            # WPML-active and WPML-inactive code paths in PHPUnit
            # via mocks. The verifier walks the source; the
            # integration test pins the same contract at PHPUnit.
            - name: WPML strategy contract gate
              run: composer test:wpml-strategy

            - name: WPML strategy integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_WPML_Strategy_Test.php

            # Phase 58: count acceptance matrix — the auditable list
            # of "every numeric check must hold" for the release.
            # dist/acceptance-matrix.json declares >= 25 cells;
            # the verifier walks every cell and asserts its ci_command
            # is wired in composer.json + its ci_step is wired in
            # ci.yml; the integration test pins the same contract
            # at the PHPUnit boundary.
            - name: Acceptance matrix contract gate
              run: composer test:acceptance-matrix

            - name: Acceptance matrix integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Acceptance_Matrix_Test.php

            # Phase 59: debug / operational log acceptance — sensitive
            # keys must be redacted, IP-like keys hashed via HMAC-SHA-256,
            # JWT-shaped strings redacted, messages bounded to 4000 chars,
            # context strings bounded to 2000 chars, canonical shape
            # `[ISO_TIMESTAMP] [LEVEL] message | json` preserved.
            # The verifier walks includes/class-sscribe-logger.php +
            # trait-sscribe-logger-common.php; the integration test
            # exercises the trait directly to prove runtime behavior.
            - name: Debug log acceptance contract gate
              run: composer test:debug-log

            - name: Debug log acceptance integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Debug_Log_Test.php

            # Phase 60: no raw internal details — user-facing surfaces
            # (admin UI, AJAX responses, REST endpoints, error messages,
            # log entries, JavaScript-visible PHP) must NEVER leak raw
            # filesystem paths, raw SQL fragments, raw $wpdb->last_error
            # echoes, ABSPATH literals, or ungated debug_backtrace
            # stacks. The verifier scans every PHP file under
            # includes/ + admin/; the integration test pins the same
            # contract at the PHPUnit boundary.
            - name: No-internal-details contract gate
              run: composer test:no-internal-details

            - name: No-internal-details integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_No_Internal_Details_Test.php

            # Phase 61: CI command documentation — every composer
            # test:* script + every canonical ci.yml step keyword must
            # be documented in docs/CI_COMMANDS.md with Purpose / Gates
            # / Failure / Debug / Manifest fields. The verifier walks
            # composer.json + ci.yml + the doc; the integration test
            # pins the same contract at the PHPUnit boundary.
            - name: CI docs contract gate
              run: composer test:ci-docs

            - name: CI docs integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_CI_Docs_Test.php

            # Phase 62: build-after-test vs test-after-build — the
            # release pipeline MUST run in this order:
            #   1. Tests (PHPUnit + every verifier) FIRST.
            #   2. THEN build the ZIP (build-release.php).
            #   3. THEN run WordPress Plugin Check on the ZIP.
            # The verifier walks ci.yml (plugin-check job), release.yml
            # (certify job), and bin/release-audit.sh; the integration
            # test pins the same contract at the PHPUnit boundary.
            # Without this gate, a regression that builds the ZIP
            # BEFORE tests run silently ships a broken build, or a
            # regression that runs Plugin Check BEFORE the build
            # becomes meaningless.
            - name: Build-order contract gate
              run: composer test:build-order

            - name: Build-order integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Build_Order_Test.php

            # Phase 63: exact package clean install — the published
            # ZIP at dist/sscribe-export-site-pages-{VERSION}.zip
            # must install + activate cleanly on a fresh WP install.
            # The verifier asserts the structural contract (ZIP
            # exists, version matches, activator + uninstall are
            # intact, smoke doc references the canonical filename);
            # the integration test pins the same contract at the
            # PHPUnit boundary by walking the ZIP directly.
            - name: Exact-package clean-install contract gate
              run: composer test:exact-package-clean-install

            - name: Exact-package clean-install integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Exact_Package_Clean_Install_Test.php

            # Phase 64: Plugin Check warning triage — the canonical
            # auditable triage doc at docs/PLUGIN_CHECK_WARNINGS_v2.0.0.md
            # declares every Plugin Check warning and its status
            # (fixed / acknowledged / in_progress / deferred). A
            # regression that introduces a NEW warning not in the
            # table fails this gate before the WP.org reviewer sees
            # it. The verifier also enforces the source-level
            # guardrails (no PHP short open tag, no eval(), no
            # extract() of superglobals).
            - name: Plugin Check triage contract gate
              run: composer test:plugin-check-triage

            - name: Plugin Check triage integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Plugin_Check_Triage_Test.php

            # Phase 65: JavaScript error-free requirement — every
            # shipped file under admin/js/ must be runtime-clean:
            # no console.error / console.warn, no alert/confirm/
            # prompt, no document.write, no eval() or new Function(),
            # no `var ` declarations, every file declares strict
            # mode, every .then() chain is matched by a .catch().
            # Without this guard a regression ships admin JS that
            # surfaces the WP script-error overlay to every site
            # owner.
            - name: JS error-free contract gate
              run: composer test:js-error-free

            - name: JS error-free integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_JS_Error_Free_Test.php

            # Phase 66: AJAX network trace requirement — every
            # wp_ajax_sscribe_* action registered in source MUST
            # appear as a row in docs/AJAX_NETWORK_TRACE_v2.0.0.md
            # with Action / Handler / Capability / Nonce action /
            # Rate-limit bucket / Response shape columns. The
            # verifier also asserts zero public (nopriv) actions
            # are ever registered.
            - name: AJAX network trace contract gate
              run: composer test:ajax-network-trace

            - name: AJAX network trace integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_AJAX_Network_Trace_Test.php

            # Phase 67: UI refactor discipline — the admin
            # surface (PHP classes, CSS, JS, partials) MUST stay
            # at the v1.9.0 file count from the commit that
            # declared the freeze. The verifier records the
            # BASELINE_SHA, walks `git ls-tree` at HEAD and at
            # the baseline, and asserts they match exactly; the
            # diff between baseline and HEAD must contain zero
            # renames and zero additions under admin/css/,
            # admin/js/, admin/partials/, or admin/*.php. A
            # post-release modularization backlog records what is
            # intentionally deferred so the freeze stays scoped.
            - name: UI refactor discipline contract gate
              run: composer test:ui-refactor-discipline

            - name: UI refactor discipline integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_UI_Refactor_Discipline_Test.php

            # Phase 68: Required new tests — the v2.0.0 spec
            # requires regression coverage for 24 specific
            # scenarios (stale count response, aborted count XHR,
            # __all__ sentinel paths, preflight 429/503/500, etc.).
            # The verifier walks tests/Integration/ and tests/Unit/
            # and asserts each canonical signature phrase from
            # docs/REQUIRED_NEW_TESTS_v2.0.0.md appears in at
            # least one test method name OR docblock. A coverage
            # manifest at dist/phase-68-test-coverage-manifest.json
            # records which test method covers each signature.
            - name: Phase 68 test coverage contract gate
              run: composer test:phase-68-test-coverage

            - name: Phase 68 test coverage integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Phase_68_Test_Coverage_Test.php

            # Phase 69: Manual / runtime tests runbook — every
            # release must be exercised on the EXACT release ZIP
            # in 6 realistic environments: standard WordPress,
            # WordPress + WPML, Redis object cache ON, Redis
            # object cache OFF, OpenLiteSpeed, Cloudflare / proxy.
            # The verifier asserts the runbook at
            # docs/MANUAL_RUNTIME_TESTS_v2.0.0.md declares the
            # canonical sections and explicitly lists all 6
            # environments. Automated PHPUnit tests cannot replace
            # this runbook — the gate is the existence + coverage
            # of the runbook, and reviewer evidence must be
            # recorded in docs/CI_EVIDENCE_v2.0.0.md.
            - name: Manual runtime tests runbook gate
              run: composer test:manual-runtime-tests

            - name: Manual runtime tests integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Manual_Runtime_Tests_Test.php

            # Phase 70: Final release blockers — the v2.0.0
            # release MUST NOT be declared ready while ANY canonical
            # release-blocker is OPEN or BLOCKED. The release
            # blockers checklist at docs/RELEASE_BLOCKERS_v2.0.0.md
            # declares 20 canonical blockers, each marked RESOLVED
            # or DEFERRED with evidence. The verifier walks the
            # checklist and asserts the canonical sections exist,
            # every blocker row is present, and every status is
            # RESOLVED or DEFERRED. The integration test pins the
            # same contract at the PHPUnit boundary.
            - name: Release blockers contract gate
              run: composer test:release-blockers

            - name: Release blockers integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Release_Blockers_Test.php

            # Phase 71: Required final CI state — the v2.0.0
            # release tag MUST NOT be created until every
            # canonical required CI job (version-check, lint,
            # test, audit, frontend-quality, real-wp-tests,
            # coverage, plugin-check) is SUCCESS on the exact
            # final SHA. The final-CI-state checklist at
            # docs/FINAL_CI_STATE_v2.0.0.md declares the
            # canonical list of required jobs and their
            # allowed statuses. The verifier walks the
            # checklist and asserts the canonical sections
            # exist, every required job is listed, and every
            # status is SUCCESS or SKIPPED. The integration
            # test pins the same contract at the PHPUnit
            # boundary.
            - name: Final CI state contract gate
              run: composer test:final-ci-state

            - name: Final CI state integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Final_CI_State_Test.php

            # Phase 72: Required exact artifact evidence — the
            # release tag MUST NOT be cut until the bit-level
            # audit trail for the exact release ZIP is recorded:
            # SHA-256, byte size, file count, source SHA, builder
            # run ID, builder workflow, plugin check URL, clean
            # install doc reference, and build timestamp. The
            # artifact-evidence doc at
            # docs/EXACT_ARTIFACT_EVIDENCE_v2.0.0.md declares
            # the canonical 12 fields. The verifier walks the
            # doc and asserts every field is present; the
            # integration test pins the same contract at the
            # PHPUnit boundary.
            - name: Exact artifact evidence contract gate
              run: composer test:exact-artifact-evidence

            - name: Exact artifact evidence integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Exact_Artifact_Evidence_Test.php

            # Phase 51: release scripts must derive version dynamically
            # from SSCRIBE_VERSION. The version-sync verifier already
            # covers this source-level, but a dedicated integration
            # test pins the contract at the PHPUnit boundary.
            - name: Version sync release-script contract regression
              run: vendor/bin/phpunit tests/Integration/SScribe_Version_Sync_Test.php

            # Phase 23: License SPDX regression — mainfile / readme.txt /
            # composer.json must all use the canonical GPL-2.0-or-later
            # identifier, and license.txt must ship the full GPL v2 text.
            - name: License SPDX integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_License_SPDIX_Test.php

    frontend-quality:
        name: JavaScript and CSS Quality
        runs-on: ubuntu-latest
        needs: version-check
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: npm

            - name: Install locked development dependencies
              run: npm ci --ignore-scripts

            - name: Run JavaScript and CSS linters
              run: npm run lint

            - name: Verify formatting
              run: npm run format:check

            - name: Audit JavaScript dependencies
              run: npm audit --audit-level=high

    audit:
        name: Security Audit
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  extensions: fileinfo

            - name: Install locked dependencies
              run: composer install --no-interaction --no-progress

            - name: Composer security audit
              run: composer audit --locked --format=plain --abandoned=fail

            - name: AI-artifact scan (em-dash, en-dash, LLM phrasings)
              run: php scripts/check-ai-artifacts.php

    lint:
        name: PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        needs: version-check
        strategy:
            matrix:
                php-version: ['8.2', '8.3', '8.4', '8.5']
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  coverage: none
                  extensions: fileinfo

            - name: PHP Syntax Check
              run: |
                  has_errors=false
                  for file in $(find . -name "*.php" -not -path "./vendor/*" -not -path "./.git/*"); do
                    output=$(php -l "$file" 2>&1)
                    if echo "$output" | grep -q "Parse error"; then
                      echo "$output"
                      has_errors=true
                    fi
                  done
                  if [ "$has_errors" = true ]; then
                    exit 1
                  fi
                  echo "All PHP files have valid syntax"

    test:
        name: Tests PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        needs: lint
        strategy:
            matrix:
                php-version: ['8.2', '8.4', '8.5']
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  coverage: none
                  extensions: fileinfo, sqlite3, pdo_sqlite

            - name: Cache Composer dependencies
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-vendor-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-vendor-

            - name: Install dependencies
              run: composer install --no-progress

            - name: Generate prefixed vendor tree
              run: composer vendor:prefix
            - name: Run PHPUnit
              run: composer test

            - name: Run PHPStan
              run: composer stan

            - name: Run PHPCS
              run: composer cs

    real-wp-tests:
        name: Real WordPress Integration Suite (matrix)
        runs-on: ubuntu-latest
        needs: test
        strategy:
            fail-fast: false
            matrix:
                # PHP versions the plugin supports (>= 8.2 per composer.json).
                # Each leg boots a real WordPress testbench against the
                # matching PHP, then runs the SQLite drop-in WP test suite.
                # This is what makes real-wp-tests a MATRIX rather than a
                # smoke test: a regression on the 8.2 floor or the previous
                # WP version surfaces here before it reaches WP.org.
                php-version: ['8.2', '8.3', '8.4']
                # WordPress versions still on the WP.org "current + N-1"
                # support window. We pin to two versions so a regression
                # that drops a recently-removed WP API or assumes a
                # not-yet-shipped WP API is caught.
                wp-version: ['latest', 'previous']
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  coverage: none
                  extensions: fileinfo, sqlite3, pdo_sqlite

            - name: Cache Composer dependencies
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-vendor-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-vendor-

            - name: Install dependencies
              run: composer install --no-progress

            - name: Install WordPress testbench (SQLite drop-in, WP ${{ matrix.wp-version }})
              run: composer test:wp:install -- --version ${{ matrix.wp-version }}

            - name: Generate prefixed vendor tree
              run: composer vendor:prefix

            - name: Run real WordPress integration suite (PHP ${{ matrix.php-version }} / WP ${{ matrix.wp-version }})
              run: composer test:wp
              id: wp-test

            - name: Upload per-leg test log
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: real-wp-test-log-php-${{ matrix.php-version }}-wp-${{ matrix.wp-version }}
                  path: |
                      tests-wp/_output/phpunit.log
                      tests-wp/_output/phpunit.xml
                  if-no-files-found: warn
                  retention-days: 7

    coverage:
        name: Coverage PHP 8.4
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: fileinfo
                  coverage: xdebug

            - name: Cache Composer dependencies
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-8.4-vendor-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.4-vendor-

            - name: Install dependencies
              run: composer install --no-progress

            - name: Generate prefixed vendor tree
              run: composer vendor:prefix

            - name: Run tests with coverage
              run: composer test:coverage

            - name: Enforce coverage-threshold gate
              run: composer test:coverage:check

            - name: Upload coverage report
              uses: actions/upload-artifact@v6
              with:
                  name: coverage-report
                  path: coverage/

            - name: Upload coverage threshold manifest
              uses: actions/upload-artifact@v6
              with:
                  name: coverage-threshold-manifest
                  path: dist/coverage-threshold-manifest.json

    plugin-check:
        name: Submission Package Check
        runs-on: ubuntu-latest
        needs: [test, frontend-quality, audit, real-wp-tests]
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  extensions: fileinfo, zip

            - name: Install locked dependencies
              run: composer install --no-interaction --no-progress

            - name: Generate prefixed vendor tree
              run: composer vendor:prefix

            - name: Build the exact submission package
              run: php scripts/build-release.php

            - name: Run official WordPress Plugin Check
              uses: wordpress/plugin-check-action@v1
              with:
                  build-dir: ./dist/sscribe-export-site-pages
                  strict: true
                  include-experimental: true
