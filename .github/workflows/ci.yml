name: CI

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
    schedule:
        - cron: '0 6 * * 1' # Every Monday at 06:00 UTC

jobs:
    version-check:
        name: Version Sync Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  extensions: fileinfo

            - name: Cache Composer dependencies
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-8.4-vendor-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.4-vendor-

            - name: Install dependencies
              run: composer install --no-progress

            # Phase 16: script-level drift detection (constant vs readme.txt
            # Stable tag vs plugin header vs all CSS/JS @version strings).
            - name: Verify version synchronization
              run: php scripts/verify-version-sync.php

            # Phase 16: PHPUnit-level regression on the SSCRIBE_VERSION ↔
            # readme.txt ↔ package.json contract (locks the canonical
            # source-of-truth at the unit-test boundary).
            - name: Version sync integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Version_Sync_Test.php

            # Phase 24: Upgrade Notice CI — enforces the WP.org contract
            # for the readme.txt == Upgrade Notice == section (presence,
            # body length, no HTML/Markdown, single paragraph, every entry
            # has a matching Changelog, Stable tag has a matching entry).
            - name: Verify Upgrade Notice contract
              run: php scripts/verify-upgrade-notice.php

            # Phase 24: PHPUnit-level regression for the Upgrade Notice
            # verifier — runs the script against well-formed and mutated
            # readme.txt payloads.
            - name: Upgrade Notice integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Upgrade_Notice_Test.php

            # Phase 25: WP/PHP minimum CI — locks mainfile header ↔
            # readme.txt ↔ runtime version_compare() guard. Drift here
            # ships an installable-on-PHP-8.1 build that fatals on
            # first admin page load.
            - name: Verify WP/PHP minimum contract
              run: php scripts/verify-min-versions.php

            # Phase 25: PHPUnit-level regression for the WP/PHP minimum
            # verifier — runs the script against well-formed and mutated
            # mainfile + readme.txt pairs.
            - name: WP/PHP minimum integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Minimum_Versions_Test.php

            # Phase 26: Tested-up-to CI — locks the readme.txt
            # `Tested up to:` header inside the canonical WP range
            # (declared WP minimum .. freshness ceiling). A stale or
            # typo'd header is rejected by Plugin Check at submission.
            - name: Verify Tested up to contract
              run: php scripts/verify-tested-up-to.php

            # Phase 26: PHPUnit-level regression for the Tested-up-to
            # verifier — runs the script against well-formed and mutated
            # readme.txt payloads.
            - name: Tested up to integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Tested_Up_To_Test.php

            # Phase 27: Real WordPress testbench contract — pins the
            # presence of bin/install-wp-tests.sh, phpunit-wp.xml,
            # tests-wp/wp-tests-config.php, tests-wp/bootstrap.php, the
            # SQLite drop-in plugin, and SScribe_WP_TestCase extending
            # WP_UnitTestCase. Also runs a clean phpunit-wp pass against
            # the live bench (skipped if bench not installed locally).
            - name: Real WP testbench contract
              run: vendor/bin/phpunit tests/Integration/SScribe_Real_WP_Testbench_Test.php

            # Phase 28: Strauss vendor-prefix contract — enforces that
            # composer.json declares the extra.strauss block (target,
            # namespace_prefix, classmap_prefix, packages), that the
            # vendor:prefix script is wired with the three fixup
            # passes, and that vendor-prefixed/ does not leak any
            # un-prefixed library class. Without this, SScribe ships
            # with classes that collide with every other plugin on a
            # shared WordPress install.
            - name: Verify Strauss vendor-prefix contract
              run: php scripts/verify-strauss-config.php

            # Phase 28: PHPUnit-level regression for the Strauss
            # verifier — runs against well-formed and mutated composer.json
            # payloads.
            - name: Strauss vendor-prefix integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Strauss_Config_Test.php

            # Phase 29: E2E dev-dependency contract — pins package.json
            # devDependencies (@playwright/test, @axe-core/playwright,
            # @wp-playground/cli), the test:e2e:* npm scripts, the
            # playwright.config.ts project list (e2e, a11y, perf), the
            # presence of tests-e2e/{e2e,a11y}/ subdirs, and the
            # composer release:prepare + release scripts.
            - name: Verify E2E dev-dependency contract
              run: php scripts/verify-e2e-deps.php

            # Phase 29: PHPUnit-level regression for the E2E deps
            # verifier — runs against well-formed and mutated payloads.
            - name: E2E dev-dependency integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_E2E_Deps_Test.php

            # Phase 31: continue-on-error contract — pins the per-page
            # try/catch + `continue` on no-page-data / insufficient-memory
            # branches, the sscribe_after_export_page observability
            # seam, the failed_pages column in the activator schema,
            # the failed_pages persistence in export_stats, and the
            # failed_pages tally in the finalizer. Without this guard,
            # a single bad page aborts the whole export.
            - name: Verify continue-on-error contract
              run: php scripts/verify-continue-on-error.php

            # Phase 31: PHPUnit-level regression for the continue-on-error
            # verifier — runs against well-formed and mutated production
            # payloads.
            - name: Continue-on-error integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Continue_On_Error_Test.php

            # Phase 32: security scanner — enforces the no-eval / no-shell /
            # no-extract / no-$$_GET / no-bare-wp_ajax baseline across
            # every shipped .php file under includes/, admin/, public/.
            # A single line of eval( $_POST['code'] ) ships to every
            # install the moment it is merged.
            - name: Security scanner
              run: php scripts/verify-security-scan.php

            # Phase 32: PHPUnit-level regression for the security
            # scanner — runs against well-formed and mutated payloads.
            - name: Security scanner integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Security_Scan_Test.php

            # Phase 33: WordPress Plugin Check CI contract — pins the
            # plugin-check job (uses wordpress/plugin-check-action@v1,
            # strict: true, include-experimental: true, depends on
            # [test, frontend-quality, audit, real-wp-tests], audits
            # ./dist/sscribe-export-site-pages). Without this guard,
            # a regression in the Plugin Check wiring silently ships
            # a build that WP.org rejects on submission.
            - name: Verify Plugin Check CI contract
              run: php scripts/verify-plugin-check.php

            # Phase 33: PHPUnit-level regression for the Plugin Check
            # verifier — runs against well-formed and mutated ci.yml
            # payloads.
            - name: Plugin Check CI integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Plugin_Check_Test.php

            # Phase 34: ZIP certification — enforces the official WP.org
            # submission ZIP contract (well-formed ZipArchive, exactly one
            # `sscribe-export-site-pages/` top-level entry, required
            # mainfile/readme/license/uninstall/autoload entries, no
            # dev-only paths, no forbidden extensions, < 10 MB
            # compressed, matching SHA-256 sidecar). Without this guard,
            # a regression in scripts/build-release.php silently ships
            # a ZIP that WP.org rejects on submission. The
            # `--skip-validation` flag bypasses the pre-flight test /
            # PHPStan / PHPCS pass (already enforced by the `test` and
            # `lint` jobs) so the build only produces the dist tree
            # this verifier certifies.
            - name: Build the submission ZIP
              run: php scripts/build-release.php --skip-validation

            - name: Verify ZIP certification contract
              run: php scripts/verify-zip-certification.php

            # Phase 34: PHPUnit-level regression for the ZIP
            # certification verifier — runs against well-formed and
            # mutated synthetic ZIPs.
            - name: ZIP certification integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_ZIP_Certification_Test.php

            # Phase 35: ZIP content rules — walks the dist tree the ZIP
            # was packaged from and enforces every shipped PHP file
            # parses, the composer.json autoload still points at
            # `vendor-prefixed/` (not `vendor/`), readme.txt fits the
            # WP.org 10 KiB cap, languages/ ships a translation file,
            # no entry is empty, no OS-metadata files (.DS_Store /
            # Thumbs.db / desktop.ini) leak in, the dist mainfile
            # Version header matches the ZIP filename version, no
            # dev-only top-level directory (`.git/`, `tests/`,
            # `node_modules/`, `.idea/`, plain `vendor/`, …) ships,
            # no IDE/temp/env/log marker (`.env`, `*.swp`, `*.log`)
            # leaks in, and the runtime directories WP.org requires
            # (`vendor-prefixed/`, `assets/`, `license.txt`,
            # `uninstall.php`) are present.
            - name: Verify ZIP content rules
              run: php scripts/verify-zip-content-rules.php

            # Phase 35: PHPUnit-level regression for the ZIP content
            # rules verifier — runs against well-formed and mutated
            # synthetic dist trees.
            - name: ZIP content rules integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_ZIP_Content_Rules_Test.php

            # Phase 36: source / build transparency — WP.org reviewers
            # must be able to reproduce the shipped ZIP. readme.txt
            # must carry a `== Development ==` section that names the
            # public source repo, lists every build command, and pins
            # the required tool versions; composer.json must declare
            # the PHP version floor; composer.lock must be committed;
            # package.json must pin the Node version in `engines`;
            # scripts/build-release.php must exist; and
            # docs/BUILD_TRANSFORMATIONS.md must document every build
            # transformation. A regression that drops the source URL,
            # unpins a tool version, or deletes the build doc fails
            # the gate before submission.
            - name: Verify build transparency contract
              run: php scripts/verify-build-transparency.php

            # Phase 36: PHPUnit-level regression for the build
            # transparency verifier — runs against the live repo with
            # one-off mutations (stripped Development section, blanked
            # Author URI, missing composer.lock, missing build doc).
            - name: Build transparency integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Build_Transparency_Test.php

            # Phase 37: third-party license inventory — walks the shipped
            # dist tree (the same tree the submission ZIP was packaged
            # from) and asserts every bundled dependency ships its own
            # LICENSE / COPYING / NOTICE with a GPL-2.0-or-later
            # compatible SPDX identifier. WP.org reviewers specifically
            # check mPDF (GPL-2.0-only), PHPWord (LGPL-3.0-only),
            # PSR/container (MIT), and bundled fonts (OFL-1.1). A
            # missing or incompatible license is an automatic reject.
            - name: Verify third-party license inventory
              run: php scripts/verify-third-party-license.php

            # Phase 37: PHPUnit-level regression for the third-party
            # license verifier — runs against the live dist tree with
            # one-off mutations (missing mpdf LICENSE.txt, proprietary
            # license body, missing font OFL.txt).
            - name: Third-party license inventory integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Third_Party_License_Test.php

            # Phase 38: mkdir() containment — audits every wp_mkdir_p()
            # and SScribe_Filesystem->mkdir() callsite under includes/,
            # admin/, public/. Each callsite must be either inside
            # SScribe_Private_Storage, routed through the public
            # SScribe_Filesystem surface (which carries its own
            # containment check), or explicitly annotated as a
            # transient working-file tempdir. Without this guard,
            # a future caller can slip a wp_mkdir_p('/tmp/foo') past
            # the audit and ship a release that escapes SScribe's
            # private-storage boundary.
            - name: Verify mkdir() containment contract
              run: php scripts/verify-mkdir-containment.php

            # Phase 38: PHPUnit-level regression for the mkdir()
            # containment verifier — runs against the live source
            # tree with a one-off mutation (an uncategorised
            # wp_mkdir_p() callsite planted under admin/).
            - name: mkdir() containment integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Mkdir_Containment_Test.php

            # Phase 39: sticky-bit regression — pins every scenario
            # the security invariant requires (current-owned 0700,
            # foreign-owned 0755/0777 reject, foreign-owned 01777
            # accept, symlink reject, public-root reject). Without
            # these explicit regressions a future "simplification" of
            # is_owned_by_current_process() could silently re-weaken
            # the shared-host defense and ship a release that exposes
            # private exports on shared hosts. The POSIX branches
            # are exercised on the Linux CI runners.
            - name: Sticky-bit regression integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Sticky_Bit_Regression_Test.php

            # Phase 40: PHPStan ignore-rule audit — every ignoreErrors
            # entry in phpstan.neon must be classified as either
            # `unavoidable_third_party` (WP/mPDF/DOM stub missing) or
            # `technical_debt` (known runtime-guard false positive).
            # Broad directory globs (`admin/*`, `vendor/*`) and
            # unclassified patterns are release blockers — the spec
            # explicitly forbids baseline-style "ignore everything in
            # admin/*" suppressions.
            - name: Verify PHPStan ignore-rule audit
              run: php scripts/verify-phpstan-ignores.php

            # Phase 40: PHPUnit-level regression for the ignore-rule
            # audit — confirms the manifest persists, the
            # classification table covers every rule, and PHPStan
            # itself still passes at Level 7.
            - name: PHPStan ignore-rule audit integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_PHPStan_Ignores_Test.php

            # Phase 41: coverage-threshold gate — the verifier parses
            # the Clover XML written by phpunit.xml's <coverage>
            # block and enforces two contracts: project-wide ≥ 70%
            # and every security-critical module ≥ 90% (private
            # storage, filesystem, security, audit trail). This
            # integration test exercises the verifier with planted
            # fixtures (well-formed, low project coverage, low
            # critical-module coverage, missing critical file,
            # missing clover.xml) so the gate contract is locked
            # without depending on a coverage driver on the local
            # machine.
            - name: Coverage threshold gate integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_Coverage_Thresholds_Test.php

            # Phase 23: License SPDX regression — mainfile / readme.txt /
            # composer.json must all use the canonical GPL-2.0-or-later
            # identifier, and license.txt must ship the full GPL v2 text.
            - name: License SPDX integration test
              run: vendor/bin/phpunit tests/Integration/SScribe_License_SPDIX_Test.php

    frontend-quality:
        name: JavaScript and CSS Quality
        runs-on: ubuntu-latest
        needs: version-check
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: npm

            - name: Install locked development dependencies
              run: npm ci --ignore-scripts

            - name: Run JavaScript and CSS linters
              run: npm run lint

            - name: Verify formatting
              run: npm run format:check

            - name: Audit JavaScript dependencies
              run: npm audit --audit-level=high

    audit:
        name: Security Audit
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  extensions: fileinfo

            - name: Install locked dependencies
              run: composer install --no-interaction --no-progress

            - name: Composer security audit
              run: composer audit --locked --format=plain --abandoned=fail

            - name: AI-artifact scan (em-dash, en-dash, LLM phrasings)
              run: php scripts/check-ai-artifacts.php

    lint:
        name: PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        needs: version-check
        strategy:
            matrix:
                php-version: ['8.2', '8.3', '8.4', '8.5']
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  coverage: none
                  extensions: fileinfo

            - name: PHP Syntax Check
              run: |
                  has_errors=false
                  for file in $(find . -name "*.php" -not -path "./vendor/*" -not -path "./.git/*"); do
                    output=$(php -l "$file" 2>&1)
                    if echo "$output" | grep -q "Parse error"; then
                      echo "$output"
                      has_errors=true
                    fi
                  done
                  if [ "$has_errors" = true ]; then
                    exit 1
                  fi
                  echo "All PHP files have valid syntax"

    test:
        name: Tests PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        needs: lint
        strategy:
            matrix:
                php-version: ['8.2', '8.4', '8.5']
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  coverage: none
                  extensions: fileinfo, sqlite3, pdo_sqlite

            - name: Cache Composer dependencies
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-vendor-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-vendor-

            - name: Install dependencies
              run: composer install --no-progress

            - name: Generate prefixed vendor tree
              run: composer vendor:prefix
            - name: Run PHPUnit
              run: composer test

            - name: Run PHPStan
              run: composer stan

            - name: Run PHPCS
              run: composer cs

    real-wp-tests:
        name: Real WordPress Integration Suite (SQLite)
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  extensions: fileinfo, sqlite3, pdo_sqlite

            - name: Cache Composer dependencies
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-8.4-vendor-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.4-vendor-

            - name: Install dependencies
              run: composer install --no-progress

            - name: Install WordPress testbench (SQLite drop-in)
              run: composer test:wp:install

            - name: Generate prefixed vendor tree
              run: composer vendor:prefix

            - name: Run real WordPress integration suite
              run: composer test:wp

    coverage:
        name: Coverage PHP 8.4
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: fileinfo
                  coverage: xdebug

            - name: Cache Composer dependencies
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-8.4-vendor-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.4-vendor-

            - name: Install dependencies
              run: composer install --no-progress

            - name: Generate prefixed vendor tree
              run: composer vendor:prefix

            - name: Run tests with coverage
              run: composer test:coverage

            - name: Enforce coverage-threshold gate
              run: composer test:coverage:check

            - name: Upload coverage report
              uses: actions/upload-artifact@v6
              with:
                  name: coverage-report
                  path: coverage/

            - name: Upload coverage threshold manifest
              uses: actions/upload-artifact@v6
              with:
                  name: coverage-threshold-manifest
                  path: dist/coverage-threshold-manifest.json

    plugin-check:
        name: Submission Package Check
        runs-on: ubuntu-latest
        needs: [test, frontend-quality, audit, real-wp-tests]
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  extensions: fileinfo, zip

            - name: Install locked dependencies
              run: composer install --no-interaction --no-progress

            - name: Generate prefixed vendor tree
              run: composer vendor:prefix

            - name: Build the exact submission package
              run: php scripts/build-release.php

            - name: Run official WordPress Plugin Check
              uses: wordpress/plugin-check-action@v1
              with:
                  build-dir: ./dist/sscribe-export-site-pages
                  strict: true
                  include-experimental: true
