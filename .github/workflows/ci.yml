name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  version-check:
    name: Version Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: fileinfo

      - name: Verify version synchronization
        run: php scripts/verify-version-sync.php

  lint:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    needs: version-check
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: fileinfo

      - name: PHP Syntax Check
        run: |
          has_errors=false
          for file in $(find . -name "*.php" -not -path "./vendor/*" -not -path "./.git/*"); do
            output=$(php -l "$file" 2>&1)
            if echo "$output" | grep -q "Parse error"; then
              echo "$output"
              has_errors=true
            fi
          done
          if [ "$has_errors" = true ]; then
            exit 1
          fi
          echo "All PHP files have valid syntax"

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        php-version: ['8.2', '8.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: fileinfo

      - name: Install dependencies
        run: composer install --no-progress

      - name: Generate prefixed vendor tree
        run: composer vendor:prefix

      - name: Build assets
        run: composer build

      - name: Run PHPUnit
        run: composer test

      - name: Run PHPStan
        run: composer stan

      - name: Run PHPCS
        run: composer cs
