name: tcpdf7-probe

on:
  push:
    branches:
      - audit/wporg-2.0.3-final

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: ctype, curl, dom, filter, gd, hash, json, mbstring, openssl, pcre, xml, zip, zlib
          tools: composer:v2

      - name: Install locked dependencies without project scripts
        run: composer install --no-scripts --no-interaction --no-progress

      - name: Generate tc-lib PDF fonts
        run: make -C vendor/tecnickcom/tc-lib-pdf-font fonts

      - name: Report runtime dependency and font footprint
        shell: bash
        run: |
          echo "== tecnickcom package sizes =="
          du -sh vendor/tecnickcom/* | sort -h
          echo "== generated font tree =="
          du -sh vendor/tecnickcom/tc-lib-pdf-font/target/fonts
          find vendor/tecnickcom/tc-lib-pdf-font/target/fonts -type f -printf '%P %s bytes\n' | sort | head -200
          echo "== devanagari/dejavu/core candidates =="
          find vendor/tecnickcom/tc-lib-pdf-font/target/fonts -type f \( -iname '*dejavu*' -o -path '*/core/*' \) -printf '%P %s bytes\n' | sort
