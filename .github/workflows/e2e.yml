name: e2e
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium --with-deps

      - run: composer install --no-dev --no-scripts
      - run: composer vendor:prefix
      - run: composer release:prepare

      - name: Dry-run check
        run: npx playwright test --list --reporter=line

      - name: Smoke
        run: npm run test:e2e:smoke

      - name: Fast
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npm run test:e2e:fast

      - name: Full (main only)
        if: github.ref == 'refs/heads/main'
        run: npm run test:e2e:full

      - name: Regression discipline (PR only)
        if: github.event_name == 'pull_request'
        run: node tests-e2e/regression-discipline.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: perf-samples
          path: tests-e2e/.cache/perf/
