name: e2e

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Browser certification is candidate-specific; superseded PR/branch runs must
# not occupy runners after a newer commit has replaced their evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Test JavaScript audit helper
        run: npm run test:audit-helper

      - name: Audit JavaScript dependencies
        run: npm run audit:js

      - name: Install locked Composer build toolchain
        run: composer install --no-interaction --no-progress --no-scripts

      - name: Audit Composer dependencies
        run: composer audit --locked --format=plain --abandoned=fail

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # Strauss is a require-dev build dependency. It must exist while the
      # production-prefixed vendor tree is generated; package certification
      # separately proves dev dependencies do not enter the submission ZIP.
      - name: Prefix production vendor dependencies
        run: composer vendor:prefix

      - name: Certify generated vendor-prefix tree
        run: php scripts/verify-strauss-config.php --built

      - name: Build exact E2E release fixture
        run: composer release

      - name: Runtime contract
        run: npm run test:e2e:runtime-contract

      - name: Dry-run check
        run: npx playwright test --list --reporter=line
        env:
          SSCRIBE_E2E_RUNTIME: native

      - name: Smoke
        run: npm run test:e2e:smoke
        env:
          SSCRIBE_E2E_RUNTIME: native

      - name: Full E2E suite (PR + main)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npm run test:e2e:full
        env:
          SSCRIBE_E2E_RUNTIME: native

      - name: Regression discipline (PR only)
        if: github.event_name == 'pull_request'
        run: node tests-e2e/regression-discipline.mjs

      - name: Performance budget gate
        run: |
          composer test:perf
          vendor/bin/phpunit tests/Integration/SScribe_Performance_Budget_Test.php

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
