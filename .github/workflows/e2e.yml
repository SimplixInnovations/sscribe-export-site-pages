name: e2e

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Install locked Composer build toolchain
        run: composer install --no-interaction --no-progress --no-scripts

      - name: Audit Composer dependencies
        run: composer audit --locked --format=plain --abandoned=fail

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # Strauss is a require-dev build dependency. It must exist while the
      # production-prefixed vendor tree is generated; package certification
      # separately proves dev dependencies do not enter the submission ZIP.
      - name: Prefix production vendor dependencies
        run: composer vendor:prefix

      - name: Certify generated vendor-prefix tree
        run: php scripts/verify-strauss-config.php --built

      - name: Prepare release fixture
        run: composer release:prepare

      - name: Dry-run check
        run: npx playwright test --list --reporter=line

      - name: Smoke
        run: npm run test:e2e:smoke

      - name: Full E2E suite (PR + main)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npm run test:e2e:full

      - name: Regression discipline (PR only)
        if: github.event_name == 'pull_request'
        run: node tests-e2e/regression-discipline.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: perf-samples
          path: tests-e2e/.cache/perf/
