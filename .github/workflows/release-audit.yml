name: release-audit

# Single-pass promotion gate that runs the canonical cross-platform release audit.
#
# The repository uses main as its only long-lived branch.
# This workflow runs for reviewed changes targeting main and may also be invoked
# manually. It intentionally remains separate from ci.yml so release
# certification has its own auditable check.

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-audit-${{ github.ref }}
    cancel-in-progress: true

jobs:
    release-audit:
        name: release audit
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.4'
                  coverage: none
                  extensions: fileinfo, zip, sqlite3, pdo_sqlite
                  tools: composer:v2, wp-cli

            - name: Setup Node.js 24
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24'
                  cache: npm

            - name: Install locked Node development dependencies
              run: npm ci --ignore-scripts

            - name: Cache Composer dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-8.4-vendor-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.4-vendor-

            - name: Install Composer dependencies
              run: composer install --no-progress --no-interaction

            - name: Generate prefixed vendor tree (Strauss)
              run: composer vendor:prefix

            - name: Build the submission package
              run: php scripts/build-release.php

            - name: Provision WordPress + Plugin Check for release audit
              run: |
                  composer test:wp:install
                  wp --path=tests-wp/_wordpress config create --dbname=sscribe --dbuser=sscribe --dbpass=sscribe --dbhost=localhost --skip-check
                  wp --path=tests-wp/_wordpress core install --url=http://localhost --title=SScribe --admin_user=admin --admin_password=sscribe-ci-password --admin_email=ci@example.invalid --skip-email
                  wp --path=tests-wp/_wordpress plugin install plugin-check
                  ZIP_PATH="$(find dist -maxdepth 1 -type f -name 'sscribe-export-site-pages-*.zip' -print -quit)"
                  test -n "$ZIP_PATH"
                  wp --path=tests-wp/_wordpress plugin install "$ZIP_PATH" --force --activate

            - name: Run release audit
              run: composer release:audit
              env:
                  SSCRIBE_WP_ROOT: ${{ github.workspace }}/tests-wp/_wordpress
                  SSCRIBE_WP_BIN: wp
