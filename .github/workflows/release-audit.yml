name: release-audit

# Single-pass promotion gate that runs the canonical cross-platform release audit.
#
# The repository uses main as its only long-lived branch.
# This workflow runs for reviewed changes targeting main and may also be invoked
# manually. It intentionally remains separate from ci.yml so release
# certification has its own auditable check.

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-audit-${{ github.ref }}
    cancel-in-progress: true

jobs:
    release-audit:
        name: release audit
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.4'
                  coverage: none
                  extensions: fileinfo, zip, sqlite3, pdo_sqlite
                  tools: composer:v2

            # setup-php's wp-cli tool can come back missing without failing the
            # step, so install a pinned WP-CLI release and verify its checksum.
            - name: Install WP-CLI 2.12.0
              run: |
                  WP_CLI_URL="https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar"
                  curl -fsSL --retry 3 -o "$RUNNER_TEMP/wp-cli.phar" "$WP_CLI_URL"
                  echo "be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832  $RUNNER_TEMP/wp-cli.phar" | sha512sum -c -
                  sudo install -m 0755 "$RUNNER_TEMP/wp-cli.phar" /usr/local/bin/wp
                  wp --version

            - name: Setup Node.js 24
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24'
                  cache: npm

            - name: Install locked Node development dependencies
              run: npm ci --ignore-scripts

            - name: Verify two clean builds are byte-identical
              run: composer release:determinism

            # Determinism runs in a disposable checkout and preserves this one.
            - name: Build canonical package for runtime audit
              run: |
                  composer install --no-interaction --no-progress --optimize-autoloader
                  composer vendor:prefix
                  php scripts/build-release.php --skip-validation

            - name: Provision WordPress + Plugin Check for release audit
              run: |
                  composer test:wp:install
                  wp --path=tests-wp/_wordpress config create --dbname=sscribe --dbuser=sscribe --dbpass=sscribe --dbhost=localhost --skip-check
                  wp --path=tests-wp/_wordpress core install --url=http://localhost --title=SScribe --admin_user=admin --admin_password=sscribe-ci-password --admin_email=ci@example.invalid --skip-email
                  wp --path=tests-wp/_wordpress plugin install plugin-check
                  VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
                  ZIP_PATH="dist/sscribe-export-site-pages-${VERSION}.zip"
                  test -f "$ZIP_PATH"
                  wp --path=tests-wp/_wordpress plugin install "$ZIP_PATH" --force --activate

            - name: Run release audit
              run: composer release:audit
              env:
                  SSCRIBE_WP_ROOT: ${{ github.workspace }}/tests-wp/_wordpress
                  SSCRIBE_WP_BIN: wp
