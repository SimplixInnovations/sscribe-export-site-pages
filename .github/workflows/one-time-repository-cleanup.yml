name: one-time repository cleanup

on:
  push:
    branches:
      - audit/wporg-2.0.4-final-hardening
    paths:
      - .github/workflows/one-time-repository-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    name: remove stale draft releases and backup tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Validate cleanup inventory
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t drafts < <(
            gh api --paginate "repos/${REPO}/releases?per_page=100" \
              --jq '.[] | select(.draft == true) | [.id, .tag_name, .created_at] | @tsv'
          )

          if [[ "${#drafts[@]}" -ne 87 ]]; then
            echo "ERROR: expected exactly 87 stale draft releases, found ${#drafts[@]}."
            exit 1
          fi

          for row in "${drafts[@]}"; do
            IFS=$'\t' read -r id tag created <<<"${row}"
            if [[ -z "${id}" || -z "${tag}" || -z "${created}" ]]; then
              echo "ERROR: malformed draft-release inventory row: ${row}"
              exit 1
            fi
            if [[ "${created}" > "2026-04-30T23:59:59Z" ]]; then
              echo "ERROR: draft release is newer than the audited stale-development window: ${tag} ${created}"
              exit 1
            fi
          done

          mapfile -t published < <(
            gh api --paginate "repos/${REPO}/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .tag_name' | sort
          )
          expected_published=(v1.2.0 v2.0.0 v2.0.1 v2.0.2 v2.0.3)
          if [[ "${published[*]}" != "${expected_published[*]}" ]]; then
            echo "ERROR: published release inventory changed; refusing cleanup."
            printf 'Observed: %s\n' "${published[*]}"
            exit 1
          fi

          backup_sha="$(gh api "repos/${REPO}/git/ref/tags/backup-pre-cleanup-20260815" --jq '.object.sha')"
          if [[ "${backup_sha}" != "7c047f1bcf72224bbc9c6c729af7a3041529c366" ]]; then
            echo "ERROR: backup tag moved; refusing deletion. Observed ${backup_sha}"
            exit 1
          fi

          echo "Validated 87 stale drafts, 5 canonical published releases, and the exact audited backup tag."

      - name: Delete only audited stale drafts
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t draft_ids < <(
            gh api --paginate "repos/${REPO}/releases?per_page=100" \
              --jq '.[] | select(.draft == true) | .id'
          )

          if [[ "${#draft_ids[@]}" -ne 87 ]]; then
            echo "ERROR: draft inventory changed between validation and deletion."
            exit 1
          fi

          for id in "${draft_ids[@]}"; do
            echo "Deleting stale draft release id=${id}"
            gh api -X DELETE "repos/${REPO}/releases/${id}"
          done

          remaining="$(
            gh api --paginate "repos/${REPO}/releases?per_page=100" \
              --jq '.[] | select(.draft == true) | .id' | wc -l | tr -d ' '
          )"
          if [[ "${remaining}" != "0" ]]; then
            echo "ERROR: ${remaining} draft releases remain after cleanup."
            exit 1
          fi

      - name: Delete exact obsolete backup tag
        shell: bash
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/${REPO}/git/refs/tags/backup-pre-cleanup-20260815"

          if gh api "repos/${REPO}/git/ref/tags/backup-pre-cleanup-20260815" >/dev/null 2>&1; then
            echo "ERROR: obsolete backup tag still exists."
            exit 1
          fi

      - name: Verify canonical remote state
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t published < <(
            gh api --paginate "repos/${REPO}/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .tag_name' | sort
          )
          expected_published=(v1.2.0 v2.0.0 v2.0.1 v2.0.2 v2.0.3)
          if [[ "${published[*]}" != "${expected_published[*]}" ]]; then
            echo "ERROR: canonical published releases changed during cleanup."
            exit 1
          fi

          mapfile -t version_tags < <(
            gh api "repos/${REPO}/git/matching-refs/tags/v" --jq '.[].ref' \
              | sed 's#refs/tags/##' | sort
          )
          expected_tags=(v1.2.0 v1.9.0 v2.0.0 v2.0.1 v2.0.2 v2.0.3)
          if [[ "${version_tags[*]}" != "${expected_tags[*]}" ]]; then
            echo "ERROR: canonical version-tag inventory changed during cleanup."
            printf 'Observed: %s\n' "${version_tags[*]}"
            exit 1
          fi

          echo "Cleanup verified: zero drafts, obsolete backup tag absent, published releases and version tags preserved."
