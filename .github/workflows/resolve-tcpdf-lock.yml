name: Resolve TCPDF lock

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  resolve:
    if: github.head_ref == 'audit/wporg-2.0.4-post-agent-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: curl, dom, gd, mbstring, xml, zip
          tools: composer
          coverage: none
      - name: Resolve TCPDF and all transitive dependencies
        run: composer update tecnickcom/tcpdf --with-all-dependencies --no-interaction --no-progress --no-scripts
      - name: Validate resolved dependency graph
        run: composer validate --strict
      - name: Show dependency delta
        run: |
          composer show tecnickcom/tcpdf tecnickcom/tc-lib-pdf tecnickcom/tc-lib-pdf-font tecnickcom/tc-lib-file --locked
          git diff -- composer.lock
      - name: Upload resolved lock
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: resolved-tcpdf-composer-lock
          path: composer.lock
          if-no-files-found: error
          retention-days: 1
