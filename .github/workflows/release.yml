name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests Before Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run PHPUnit
        run: composer test

      - name: Run PHPStan
        run: composer stan

      - name: Run PHPCS
        run: composer cs

  build:
    name: Build WordPress Plugin
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-progress

      - name: Create WordPress.org package
        run: |
          mkdir -p build/sscribe-export-site-pages
          
          # Main plugin file
          cp sscribe-export-site-pages.php build/sscribe-export-site-pages/
          
          # Required files
          cp readme.txt build/sscribe-export-site-pages/
          cp LICENSE build/sscribe-export-site-pages/
          cp uninstall.php build/sscribe-export-site-pages/
          
          # Directories
          cp -r includes build/sscribe-export-site-pages/
          cp -r admin build/sscribe-export-site-pages/
          cp -r assets build/sscribe-export-site-pages/
          cp -r languages build/sscribe-export-site-pages/
          cp -r vendor build/sscribe-export-site-pages/
          
          # Remove files not permitted by WordPress.org
          # PCLZip (already in WordPress core)
          rm -rf build/sscribe-export-site-pages/vendor/phpoffice/phpword/src/PhpWord/Shared/PCLZip/
          
          # Vendor extra files (CHANGELOG, README, tests, docs, etc.)
          find build/sscribe-export-site-pages/vendor -type f -name "CHANGELOG*" -delete
          find build/sscribe-export-site-pages/vendor -type f -name "README*" -delete
          find build/sscribe-export-site-pages/vendor -type f -name "CONTRIBUTING*" -delete
          find build/sscribe-export-site-pages/vendor -type f -name "COPYING*" -delete
          find build/sscribe-export-site-pages/vendor -type f -name ".github_changelog_generator" -delete
          find build/sscribe-export-site-pages/vendor -type d -name ".github" -exec rm -rf {} + 2>/dev/null || true
          find build/sscribe-export-site-pages/vendor -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find build/sscribe-export-site-pages/vendor -type d -name "docs" -exec rm -rf {} + 2>/dev/null || true
          find build/sscribe-export-site-pages/vendor -type d -name "samples" -exec rm -rf {} + 2>/dev/null || true
          
          # Create ZIP
          cd build
          zip -r ../sscribe-export-site-pages.zip sscribe-export-site-pages

      - name: Verify package contents
        run: |
          echo "=== Package Contents ==="
          unzip -l sscribe-export-site-pages.zip
          echo ""
          echo "=== Verifying required files ==="
          unzip -l sscribe-export-site-pages.zip | grep -q "sscribe-export-site-pages/sscribe-export-site-pages.php" || (echo "ERROR: Main plugin file missing!" && exit 1)
          unzip -l sscribe-export-site-pages.zip | grep -q "sscribe-export-site-pages/readme.txt" || (echo "ERROR: readme.txt missing!" && exit 1)
          unzip -l sscribe-export-site-pages.zip | grep -q "sscribe-export-site-pages/LICENSE" || (echo "ERROR: LICENSE missing!" && exit 1)
          unzip -l sscribe-export-site-pages.zip | grep -q "sscribe-export-site-pages/includes/class-sscribe.php" || (echo "ERROR: Core class missing!" && exit 1)
          unzip -l sscribe-export-site-pages.zip | grep -q "sscribe-export-site-pages/vendor/" || (echo "ERROR: vendor directory missing!" && exit 1)
          unzip -l sscribe-export-site-pages.zip | grep -q "sscribe-export-site-pages/assets/icons/" || (echo "ERROR: assets/icons missing!" && exit 1)
          echo ""
          echo "=== Verifying excluded files ==="
          if unzip -l sscribe-export-site-pages.zip | grep -q "PCLZip"; then echo "ERROR: PCLZip should be excluded!" && exit 1; fi
          if unzip -l sscribe-export-site-pages.zip | grep -q "COPYING.LESSER"; then echo "ERROR: COPYING.LESSER should be excluded!" && exit 1; fi
          if unzip -l scribe-export-site-pages.zip | grep -q ".github_changelog_generator"; then echo "ERROR: .github_changelog_generator should be excluded!" && exit 1; fi
          echo "All exclusions verified!"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sscribe-export-site-pages.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
