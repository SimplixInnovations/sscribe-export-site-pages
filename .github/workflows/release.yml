name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Pre-release Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: fileinfo

      - name: Verify version synchronization
        run: php scripts/verify-version-sync.php

      - name: Verify tag matches version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PLUGIN_VERSION=$(grep -oP "define\s*\(\s*['\"]SSCRIBE_VERSION['\"]\s*,\s*['\"]\K[0-9.]+" sscribe-export-site-pages.php)
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match plugin version ($PLUGIN_VERSION)"
            exit 1
          fi
          echo "✓ Tag version matches plugin version: $TAG_VERSION"

      - name: Verify tagged commit is current main HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin main
          TAG_SHA=$(git rev-list -n 1 "$GITHUB_SHA")
          MAIN_SHA=$(git rev-parse origin/main)
          if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
            echo "Error: Release tags must point to the latest origin/main commit."
            echo "Tag SHA:  $TAG_SHA"
            echo "Main SHA: $MAIN_SHA"
            exit 1
          fi
          echo "✓ Tag commit matches origin/main HEAD"

  test:
    name: Run Tests Before Release
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: fileinfo

      - name: Install dependencies
        run: composer install --no-progress

      - name: Generate prefixed vendor tree
        run: composer vendor:prefix

      - name: Build assets
        run: composer build

      - name: Run PHPUnit
        run: composer test

      - name: Run PHPStan
        run: composer stan

      - name: Run PHPCS
        run: composer cs

  build:
    name: Build WordPress Plugin
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: fileinfo

      - name: Install build dependencies
        run: composer install --optimize-autoloader --no-progress

      - name: Generate prefixed vendor tree
        run: composer vendor:prefix

      - name: Build assets
        run: composer build

      - name: Create WordPress.org package
        run: |
          mkdir -p build/sscribe-export-site-pages

          rsync -av ./ build/sscribe-export-site-pages/ --exclude-from=.distignore

          # Create ZIP
          cd build
          zip -r ../sscribe-export-site-pages.zip sscribe-export-site-pages

      - name: Verify package contents
        run: |
          echo "=== Package Contents (first 100 files) ==="
          unzip -l sscribe-export-site-pages.zip | head -100
          echo ""
          echo "=== Verifying required files ==="
          unzip -l sscribe-export-site-pages.zip | grep -q "sscribe-export-site-pages.php" || (echo "ERROR: Main plugin file missing!" && exit 1)
          unzip -l sscribe-export-site-pages.zip | grep -q "readme.txt" || (echo "ERROR: readme.txt missing!" && exit 1)
          unzip -l sscribe-export-site-pages.zip | grep -q "vendor-prefixed/autoload.php" || (echo "ERROR: vendor-prefixed/autoload.php missing!" && exit 1)
          echo ""
          echo "=== Verifying vendor dependencies ==="
          unzip -l sscribe-export-site-pages.zip | grep -q "vendor-prefixed/" || (echo "ERROR: Prefixed vendor tree missing!" && exit 1)
          echo ""
          echo "=== Verifying PCLZip excluded ==="
          if unzip -l sscribe-export-site-pages.zip | grep -q "PCLZip"; then echo "ERROR: PCLZip should be excluded!" && exit 1; fi
          echo "✓ All verifications passed!"

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" sscribe-export-site-pages.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              sscribe-export-site-pages.zip \
              --generate-notes \
              --verify-tag
          fi
