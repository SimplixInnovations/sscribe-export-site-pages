name: Release

# Phase 53 — release workflow architecture.
#
# Separation of concerns:
#
#   1. verify    — tag/SSCRIBE_VERSION + tag/main HEAD contract.
#   2. audit     — composer security audit.
#   3. test      — phpunit + phpstan + phpcs (the same gates ci.yml ran).
#   4. certify   — builds + plugin-checks the exact bytes the release
#                  will publish. Produces the certified artifact:
#                  ZIP, .sha256 sidecar, build metadata JSON, Plugin
#                  Check result JSON. Uploads them under a fixed
#                  `sscribe-release-artifacts` artifact.
#   5. publish   — consumes the certified artifact, verifies SHA in
#                  isolation, uploads to GitHub Release, runs the
#                  download-back proof. Never re-runs composer install,
#                  vendor:prefix, or build-release.php — those are
#                  certify's job.
#
# The reason for the split: "Do not run a second uncontrolled build
# after approval." If publish re-built the ZIP, an unsynced `composer
# install` mutation or a divergent vendor tree would silently produce
# a different ZIP than the one certify audited. Splitting on SHA
# verification closes that gap: publish *cannot* proceed unless the
# certified bytes are still intact.

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    verify:
        name: Pre-release Verification
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.4'
                  coverage: none
                  extensions: fileinfo

            - name: Verify version synchronization
              run: php scripts/verify-version-sync.php

            - name: Verify tag matches version
              run: |
                  TAG_VERSION="${GITHUB_REF#refs/tags/v}"
                  PLUGIN_VERSION=$(grep -oP "define\s*\(\s*['\"]SSCRIBE_VERSION['\"]\s*,\s*['\"]\K[0-9.]+" sscribe-export-site-pages.php)
                  if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
                    echo "Error: Tag version ($TAG_VERSION) does not match plugin version ($PLUGIN_VERSION)"
                    exit 1
                  fi
                  echo "OK: Tag version matches plugin version: $TAG_VERSION"

            - name: Verify tagged commit is current main HEAD
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # Phase 17: tag-on-main only. Release tags MUST point at
                  # origin/main HEAD. Tags pointing at develop or feature
                  # branches could ship unreviewed code to WP.org.
                  git fetch --no-tags origin main
                  TAG_SHA=$(git rev-list -n 1 "$GITHUB_SHA")
                  MAIN_SHA=$(git rev-parse origin/main)
                  if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
                    echo "Error: Release tags must point to the latest origin/main commit."
                    echo "Tag SHA:    $TAG_SHA"
                    echo "Main SHA:   $MAIN_SHA"
                    echo ""
                    echo "Release workflow: cut a tag from origin/main HEAD only."
                    echo "If origin/main is behind develop, merge develop -> main first."
                    exit 1
                  fi
                  echo "OK: Tag commit matches origin/main HEAD"

    audit:
        name: Security Audit
        runs-on: ubuntu-latest
        needs: verify
        steps:
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.4'
                  coverage: none
                  extensions: fileinfo

            - name: Install locked dependencies
              run: composer install --no-interaction --no-progress

            - name: Composer security audit
              run: composer audit --locked --format=plain --abandoned=fail

    test:
        name: Run Tests Before Release
        runs-on: ubuntu-latest
        needs: audit
        steps:
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.4'
                  coverage: none
                  extensions: fileinfo, zip

            - name: Cache Composer dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-8.4-release-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.4-release-

            - name: Install dependencies
              run: composer install --no-progress

            - name: Generate prefixed vendor tree
              run: composer vendor:prefix
            - name: Run PHPUnit
              run: composer test

            - name: Run PHPStan
              run: composer stan

            - name: Run PHPCS
              run: composer cs

    certify:
        name: Certify Release Artifact
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.4'
                  coverage: none
                  extensions: fileinfo, zip

            - name: Cache Composer dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-8.4-certify-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.4-certify-

            - name: Install build dependencies
              run: composer install --optimize-autoloader --no-progress

            - name: Generate prefixed vendor tree
              run: composer vendor:prefix

            - name: Build the exact WordPress.org package
              run: php scripts/build-release.php

            - name: Record source SHA
              id: source-sha
              run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Extract ZIP SHA-256 (release evidence)
              id: zip-sha
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  SHA_FILE="dist/sscribe-export-site-pages-${VERSION}.sha256"
                  if [ ! -f "${SHA_FILE}" ]; then
                    echo "ERROR: build-release.php did not produce ${SHA_FILE}"
                    ls -la dist/
                    exit 1
                  fi
                  ZIP_SHA="$(awk '{print $1}' "${SHA_FILE}")"
                  echo "sha=${ZIP_SHA}" >> "$GITHUB_OUTPUT"
                  echo "ZIP SHA-256: ${ZIP_SHA}"

            - name: Persist build metadata
              # Phase 54: release evidence must record source SHA, tag, ZIP SHA-256.
              env:
                  SOURCE_SHA: ${{ steps.source-sha.outputs.sha }}
                  ZIP_SHA: ${{ steps.zip-sha.outputs.sha }}
                  RUN_ID: ${{ github.run_id }}
                  RUN_NUMBER: ${{ github.run_number }}
                  REF: ${{ github.ref }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  VERSION="${REF_NAME#v}"
                  cat > "dist/sscribe-export-site-pages-${VERSION}.build.json" <<EOF
                  {
                    "source_sha": "${SOURCE_SHA}",
                    "tag": "${REF_NAME}",
                    "zip_sha256": "${ZIP_SHA}",
                    "run_id": "${RUN_ID}",
                    "run_number": "${RUN_NUMBER}",
                    "build_runner": "ubuntu-latest",
                    "php_version": "8.4",
                    "built_by": "release.yml (certify job)",
                    "certified_at": "$(date -u +%FT%TZ)"
                  }
                  EOF
                  echo "Build metadata persisted to dist/sscribe-export-site-pages-${VERSION}.build.json"
                  cat "dist/sscribe-export-site-pages-${VERSION}.build.json"

            - name: Run official WordPress Plugin Check
              uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1
              with:
                  build-dir: ./dist/sscribe-export-site-pages
                  strict: true
                  include-experimental: true

            # Phase 53: the certified artifact is uploaded as a single
            # artifact so the publish job consumes it without rebuilding.
            - name: Upload certified ZIP
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: sscribe-release-zip
                  path: dist/sscribe-export-site-pages-*.zip
                  if-no-files-found: error

            - name: Upload SHA-256 sidecar
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: sscribe-release-sha
                  path: dist/sscribe-export-site-pages-*.sha256
                  if-no-files-found: error

            - name: Upload build metadata
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: sscribe-release-build-json
                  path: dist/sscribe-export-site-pages-*.build.json
                  if-no-files-found: error

    publish:
        name: Publish Certified Release
        runs-on: ubuntu-latest
        needs: certify
        steps:
            # Phase 53: download the certified ZIP/SHA/build.json.
            # Crucially this job does NOT run composer install or
            # vendor:prefix — those are certify's responsibility.
            - name: Download certified ZIP
              uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
              with:
                  name: sscribe-release-zip
                  path: dist/certified

            - name: Download SHA-256 sidecar
              uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
              with:
                  name: sscribe-release-sha
                  path: dist/certified

            - name: Download build metadata
              uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
              with:
                  name: sscribe-release-build-json
                  path: dist/certified

            # Phase 53: SHA verification happens BEFORE publishing. If
            # the artifacts roundtrip through upload/download with any
            # bytes flipped, publish stops here.
            - name: Verify ZIP SHA matches sidecar
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  cd "dist/certified"
                  ZIP_FILE="$(ls sscribe-export-site-pages-*.zip | head -n1)"
                  SHA_FILE="$(ls sscribe-export-site-pages-*.sha256 | head -n1)"
                  if [ -z "${ZIP_FILE}" ] || [ -z "${SHA_FILE}" ]; then
                    echo "ERROR: missing ZIP or SHA artifact"
                    ls -la
                    exit 1
                  fi

                  EXPECTED_SHA="$(cat "${SHA_FILE}" | awk '{print $1}')"
                  ACTUAL_SHA="$(sha256sum "${ZIP_FILE}" | awk '{print $1}')"
                  if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
                    echo "ERROR: SHA-256 mismatch — download/upload roundtrip altered the certified bytes."
                    echo "  Expected: ${EXPECTED_SHA}"
                    echo "  Actual:   ${ACTUAL_SHA}"
                    exit 1
                  fi
                  echo "OK: ZIP SHA-256 matches sidecar (${ACTUAL_SHA})."

            - name: Upload to GitHub Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  cd "dist/certified"
                  ZIP_FILE="$(ls sscribe-export-site-pages-*.zip | head -n1)"
                  SHA_FILE="$(ls sscribe-export-site-pages-*.sha256 | head -n1)"
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                    gh release upload "$GITHUB_REF_NAME" "$ZIP_FILE" "$SHA_FILE" --clobber
                  else
                    gh release create "$GITHUB_REF_NAME" \
                      "$ZIP_FILE" \
                      "$SHA_FILE" \
                      --generate-notes \
                      --verify-tag
                  fi

            # Phase 19: Auto-download proof. The release artifact must be
            # downloaded back from the just-published GitHub Release URL,
            # checked against the SHA-256 we built, and structure-verified
            # (manifest files + PHP syntax). No human confirmation required:
            # if any of these steps fail, the release job fails the build.
            - name: 'Auto-download proof: fetch + SHA-verify + structure-check'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  cd "dist/certified"
                  VERSION="${GITHUB_REF_NAME#v}"
                  ZIP_FILE="$(ls sscribe-export-site-pages-${VERSION}.zip | head -n1)"
                  SHA_FILE="$(ls sscribe-export-site-pages-${VERSION}.sha256 | head -n1)"
                  DOWNLOAD_DIR="dist/download-verify"
                  DOWNLOADED_ZIP="${DOWNLOAD_DIR}/$(basename "${ZIP_FILE}")"
                  DOWNLOADED_SHA="${DOWNLOAD_DIR}/$(basename "${SHA_FILE}")"

                  rm -rf "${DOWNLOAD_DIR}" && mkdir -p "${DOWNLOAD_DIR}"

                  # 1. Download the artifact we just uploaded.
                  if ! gh release download "$GITHUB_REF_NAME" \
                      --pattern "sscribe-export-site-pages-${VERSION}.zip" \
                      --pattern "sscribe-export-site-pages-${VERSION}.sha256" \
                      --dir "${DOWNLOAD_DIR}"; then
                    echo "ERROR: gh release download failed"
                    exit 1
                  fi

                  # 2. Verify SHA-256 matches the certified bytes.
                  LOCAL_SHA="$(sha256sum "${ZIP_FILE}" | awk '{print $1}')"
                  REMOTE_SHA="$(sha256sum "${DOWNLOADED_ZIP}" | awk '{print $1}')"
                  if [ "${LOCAL_SHA}" != "${REMOTE_SHA}" ]; then
                    echo "ERROR: SHA-256 mismatch between certified ZIP and downloaded artifact"
                    echo "  Certified:  ${LOCAL_SHA}"
                    echo "  Downloaded: ${REMOTE_SHA}"
                    exit 1
                  fi
                  echo "OK: SHA-256 matches certified ZIP"

                  # 3. Verify the published .sha256 file matches the
                  #    certified bytes (i.e. the sidecar uploaded
                  #    contained the same hash the build computed).
                  EXPECTED_SHA="$(cat "${SHA_FILE}" | awk '{print $1}')"
                  if [ "${EXPECTED_SHA}" != "${LOCAL_SHA}" ]; then
                    echo "ERROR: published .sha256 file does not match certified build"
                    exit 1
                  fi
                  echo "OK: published .sha256 file matches certified build"

                  # 4. Verify the downloaded ZIP is a valid WordPress plugin
                  #    package: contains the plugin main file with the
                  #    canonical Plugin Name header and a syntactically
                  #    valid readme.txt. A truncated or re-zipped
                  #    artifact would fail the PHP -l or grep step.
                  WORK="${DOWNLOAD_DIR}/work"
                  mkdir -p "${WORK}"
                  unzip -q "${DOWNLOADED_ZIP}" -d "${WORK}"

                  PLUGIN_DIR="${WORK}/sscribe-export-site-pages"
                  if [ ! -d "${PLUGIN_DIR}" ]; then
                    echo "ERROR: downloaded ZIP missing sscribe-export-site-pages/ root directory"
                    exit 1
                  fi

                  if ! grep -q "Plugin Name:" "${PLUGIN_DIR}/sscribe-export-site-pages.php"; then
                    echo "ERROR: downloaded ZIP missing Plugin Name header"
                    exit 1
                  fi

                  if ! grep -q "Stable tag: ${VERSION}" "${PLUGIN_DIR}/readme.txt"; then
                    echo "ERROR: downloaded ZIP readme.txt Stable tag does not match ${VERSION}"
                    exit 1
                  fi

                  # PHP -l on every .php file in the plugin dir.
                  if find "${PLUGIN_DIR}" -name '*.php' -print0 | xargs -0 -I{} php -l {} 2>&1 \
                      | grep -q "Parse error"; then
                    echo "ERROR: downloaded ZIP contains PHP files with parse errors"
                    find "${PLUGIN_DIR}" -name '*.php' -print0 | xargs -0 -I{} php -l {} 2>&1 \
                      | grep "Parse error"
                    exit 1
                  fi

                  echo "OK: downloaded ZIP structure verified (manifest + Stable tag + PHP syntax)"
