name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Pre-release Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Verify version synchronization
        run: php scripts/verify-version-sync.php

      - name: Verify tag matches version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PLUGIN_VERSION=$(grep -oP "define\s*\(\s*['\"]SSCRIBE_VERSION['\"]\s*,\s*['\"]\K[0-9.]+" sscribe-export-site-pages.php)
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match plugin version ($PLUGIN_VERSION)"
            exit 1
          fi
          echo "✓ Tag version matches plugin version: $TAG_VERSION"

  test:
    name: Run Tests Before Release
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run PHPUnit
        run: composer test

      - name: Run PHPStan
        run: composer stan

      - name: Run PHPCS
        run: composer cs

  build:
    name: Build WordPress Plugin
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-progress

      - name: Minify CSS assets
        run: composer run-script css:minify

      - name: Create WordPress.org package
        run: |
          mkdir -p build/sscribe-export-site-pages
          
          # Main plugin file
          cp sscribe-export-site-pages.php build/sscribe-export-site-pages/
          
          # Required files
          cp readme.txt build/sscribe-export-site-pages/
          cp LICENSE build/sscribe-export-site-pages/
          cp uninstall.php build/sscribe-export-site-pages/
          
          # Directories
          cp -r includes build/sscribe-export-site-pages/
          cp -r admin build/sscribe-export-site-pages/
          cp -r assets build/sscribe-export-site-pages/
          cp -r languages build/sscribe-export-site-pages/
          cp -r vendor build/sscribe-export-site-pages/
          
          # Remove only PCLZip (WordPress.org requirement - conflicts with core)
          rm -rf build/sscribe-export-site-pages/vendor/phpoffice/phpword/src/PhpWord/Shared/PCLZip/
          
          # Create ZIP
          cd build
          zip -r ../sscribe-export-site-pages.zip sscribe-export-site-pages

      - name: Verify package contents
        run: |
          echo "=== Package Contents (first 100 files) ==="
          unzip -l sscribe-export-site-pages.zip | head -100
          echo ""
          echo "=== Verifying required files ==="
          unzip -l sscribe-export-site-pages.zip | grep -q "sscribe-export-site-pages.php" || (echo "ERROR: Main plugin file missing!" && exit 1)
          unzip -l sscribe-export-site-pages.zip | grep -q "readme.txt" || (echo "ERROR: readme.txt missing!" && exit 1)
          unzip -l sscribe-export-site-pages.zip | grep -q "vendor/autoload.php" || (echo "ERROR: vendor/autoload.php missing!" && exit 1)
          echo ""
          echo "=== Verifying vendor dependencies ==="
          unzip -l sscribe-export-site-pages.zip | grep -q "dompdf/dompdf" || (echo "ERROR: Dompdf missing!" && exit 1)
          unzip -l sscribe-export-site-pages.zip | grep -q "phpoffice/phpword" || (echo "ERROR: PhpWord missing!" && exit 1)
          echo ""
          echo "=== Verifying PCLZip excluded ==="
          if unzip -l sscribe-export-site-pages.zip | grep -q "PCLZip"; then echo "ERROR: PCLZip should be excluded!" && exit 1; fi
          echo "✓ All verifications passed!"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sscribe-export-site-pages.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
