name: lockfile-refresh

permissions:
  contents: write

on:
  push:
    branches:
      - fix/2.0.0-release-blockers-final-v2

jobs:
  refresh-fast-uri:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Refresh patched transitive dependency
        run: npm update fast-uri --package-lock-only --ignore-scripts

      - name: Verify high-severity audit is clean
        run: npm audit --audit-level=high

      - name: Commit deterministic lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already contains the patched resolution."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(deps): update patched fast-uri lock resolution"
          git push origin "HEAD:${GITHUB_REF_NAME}"
