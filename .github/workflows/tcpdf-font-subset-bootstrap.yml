name: tcpdf-font-subset-bootstrap

on:
  push:
    branches:
      - audit/wporg-2.0.3-final

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: ctype, curl, dom, filter, gd, hash, json, mbstring, openssl, pcre, xml, zip, zlib
          tools: composer:v2

      - name: Install locked project dependencies
        run: composer install --no-scripts --no-interaction --no-progress

      - name: Install exact upstream font generator dependency
        run: composer --working-dir=vendor/tecnickcom/tc-lib-pdf-font/util install --no-dev --no-interaction --no-progress

      - name: Generate upstream font data
        run: php vendor/tecnickcom/tc-lib-pdf-font/util/bulk_convert.php

      - name: Stage deterministic runtime subset
        shell: bash
        run: |
          set -euo pipefail
          src="vendor/tecnickcom/tc-lib-pdf-font/target/fonts"
          dst="scripts/resources/tcpdf-fonts"
          rm -rf "$dst"
          mkdir -p "$dst/core" "$dst/dejavu"
          cp "$src/core/"*.json "$dst/core/"
          cp "$src/core/LICENSE" "$src/core/README" "$dst/core/"
          cp "$src/dejavu/LICENSE" "$src/dejavu/README" "$dst/dejavu/"
          for base in dejavusans dejavusansb dejavusansi dejavusansbi; do
            cp "$src/dejavu/$base.json" "$src/dejavu/$base.z" "$src/dejavu/$base.ctg.z" "$dst/dejavu/"
          done
          cat > "$dst/PROVENANCE.md" <<'EOF'
# TCPDF 7 runtime font subset

Generated from tecnickcom/tc-lib-pdf-font 4.3.3 using its upstream util/bulk_convert.php utility and the exact dependency graph recorded in this repository's composer.lock.

SScribe intentionally retains only the standard PDF core font descriptors and DejaVu Sans regular, bold, italic, and bold-italic data required by the PDF exporter.

The release build copies this deterministic subset into the prefixed tc-lib font package. Do not edit generated .json, .z, or .ctg.z files manually.
EOF
          find "$dst" -type f -printf '%P %s bytes\n' | sort
          du -sh "$dst"

      - name: Commit generated subset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/resources/tcpdf-fonts
          if git diff --cached --quiet; then
            echo "Font subset already current"
            exit 0
          fi
          git commit -m "build: add deterministic TCPDF 7 font subset"
          git push
