name: tcpdf-lock-refresh

on:
  push:
    branches:
      - audit/wporg-2.0.3-final

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Refresh TCPDF dependency graph
        run: composer update tecnickcom/tcpdf --with-all-dependencies --no-scripts --no-interaction --no-progress

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock already current"
            exit 0
          fi
          git commit -m "build: refresh lock for TCPDF 7.0.10"
          git push
