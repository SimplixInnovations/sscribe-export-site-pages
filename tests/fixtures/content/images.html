<p>Lazy loaded by a plugin:</p>
<img class="lazyload" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" data-src="https://example.test/wp-content/uploads/2026/10/lazy.jpg" data-srcset="https://example.test/wp-content/uploads/2026/10/lazy-300.jpg 300w, https://example.test/wp-content/uploads/2026/10/lazy-1024.jpg 1024w" alt="Lazy image" width="1024" height="683" />
<p>Native srcset without data attributes:</p>
<img src="https://example.test/wp-content/uploads/2026/10/native.jpg" srcset="https://example.test/wp-content/uploads/2026/10/native-300.jpg 300w, https://example.test/wp-content/uploads/2026/10/native-1024.jpg 1024w" sizes="(max-width: 1024px) 100vw, 1024px" alt="Native image" />
<p>Picture element:</p>
<picture>
	<source type="image/avif" srcset="https://example.test/wp-content/uploads/2026/10/pic.avif" />
	<source type="image/webp" srcset="https://example.test/wp-content/uploads/2026/10/pic.webp" />
	<img src="https://example.test/wp-content/uploads/2026/10/pic.jpg" alt="Picture fallback" width="800" height="600" />
</picture>
<p>Noscript fallback must not duplicate:</p>
<img class="lazyload" data-src="https://example.test/wp-content/uploads/2026/10/noscript.jpg" alt="With noscript" /><noscript><img src="https://example.test/wp-content/uploads/2026/10/noscript.jpg" alt="With noscript" /></noscript>
<p>Linked image:</p>
<a href="https://example.test/wp-content/uploads/2026/10/full.jpg"><img src="https://example.test/wp-content/uploads/2026/10/full-300.jpg" alt="Linked thumbnail" /></a>

<img src="" alt="Broken" />
